{% load cld %}
{% if testimonials_section and testimonials %}
<section class="reviews" id="testimonials" aria-labelledby="reviews-title">
  <div class="reviews__inner">
    <div class="reviews__head">
      <div>
        <span class="tag">{{ testimonials_section.badge_text }}</span>
        <h2 class="section-title" id="reviews-title">{{ testimonials_section.title }}</h2>
      </div>
      <p class="reviews__intro">{{ testimonials_section.description }}</p>
    </div>

    <div class="reviews__grid">
      {% for review in testimonials %}
        <figure class="review">
          <div>
            <div class="review__stars" role="img" aria-label="{{ review.rating }} out of 5 stars">
              {% for _ in review.stars %}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>{% endfor %}
            </div>
            <blockquote class="review__quote">&ldquo;{{ review.quote }}&rdquo;</blockquote>
          </div>

          <figcaption class="review__author">
            {% if review.photo %}
              <img class="review__avatar" src="{{ review.photo|cld:120 }}" alt="{{ review.name }}" loading="lazy" width="48" height="48">
            {% else %}
              <span class="review__avatar review__avatar--initials" aria-hidden="true">{{ review.initials }}</span>
            {% endif %}
            <div>
              <p class="review__name">
                {{ review.name }}
                {% if review.is_verified %}
                  <svg class="review__verified" viewBox="0 0 24 24" aria-label="Verified rider"><path fill="currentColor" stroke="none" d="M12 1.5 14.6 3.4l3.2-.2 1 3.1 2.7 1.8-.9 3.1.9 3.1-2.7 1.8-1 3.1-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3.1-2.7-1.8.9-3.1-.9-3.1 2.7-1.8 1-3.1 3.2.2z"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8" stroke="#fff" stroke-width="2.2"/></svg>
                {% endif %}
              </p>
              <p class="review__role">{{ review.role }}{% if review.detail %} &bull; {{ review.detail }}{% endif %}</p>
            </div>
          </figcaption>
        </figure>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
