{# One details box: title + label/value rows. Needs: title, rows #}
<tr><td style="padding:22px 28px 6px 28px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#10844f">{{ title }}</td></tr>
<tr><td style="padding:0 28px">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border:1px solid #e2e8f0;border-radius:8px">
    {% for label, value in rows %}
    <tr>
      <td width="38%" style="padding:11px 14px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#64748b;background:#f8faf9;{% if not forloop.last %}border-bottom:1px solid #e2e8f0;{% endif %}vertical-align:top">{{ label }}</td>
      <td style="padding:11px 14px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#181c24;font-weight:bold;{% if not forloop.last %}border-bottom:1px solid #e2e8f0;{% endif %}vertical-align:top">{{ value }}</td>
    </tr>
    {% endfor %}
  </table>
</td></tr>
